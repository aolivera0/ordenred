# docker compose build                  → construye la imagen (solo cuando cambia requirements.txt)
# docker compose run --rm ordenred      → corre todas las pruebas
# docker compose run --rm ordenred python experimentos/e4_clasificacion_etiquetado.py --fixtures --salida experimentos/resultados   → cualquier otro comando
#   (el contenedor se borra al terminar: escriba dentro del repo montado en /app, no en /tmp del contenedor)
# docker compose build --build-arg UID=$(id -u)   → en Linux, si su uid no es 1000
services:
  ordenred:
    build: .
    image: ordenred:dev
    working_dir: /app
    volumes:
      - .:/app
