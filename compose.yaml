# docker compose build                  → construye la imagen (solo cuando cambia requirements.txt)
# docker compose run --rm ordenred      → corre todas las pruebas
# docker compose run --rm ordenred python experimentos/runner.py E4   → cualquier otro comando
services:
  ordenred:
    build: .
    image: ordenred:dev
    working_dir: /app
    volumes:
      - .:/app
